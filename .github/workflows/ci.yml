name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust target and wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
      - name: Rust tests
        run: cargo test --manifest-path dsp-core/Cargo.toml
      - name: Server tests
        working-directory: server
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Web tests
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Local app tests
        run: cargo test --manifest-path desktop/Cargo.toml
      - name: Build the local app (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/build.sh --skip-tests --no-splitter
      - name: Build the local app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests -NoSplitter
